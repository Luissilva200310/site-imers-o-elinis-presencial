# A cada push na main: roda os testes e publica somente os arquivos do site
# na branch "deploy". A Hostinger observa essa branch e atualiza
# public_html/curso-presencial automaticamente.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes
        run: npm test

      - name: Montar pasta do site
        run: |
          mkdir -p site/js
          cp index.html .htaccess site/
          cp -r assets css site/
          cp js/main.js site/js/

      - name: Enviar para a branch deploy
        run: |
          cd site
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site gerado a partir de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
